name: Frontend

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-presentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FastAPI runtime for Learning Unit E2E
        run: python -m pip install 'fastapi>=0.115,<1.0' 'uvicorn>=0.30,<1.0' 'PyYAML>=6.0,<7.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit and API contract fixture tests
        run: npm run test

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build static Astro routes
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E with Learning Unit API and Today contract fixture
        env:
          CI: true
        run: npm run test:e2e
