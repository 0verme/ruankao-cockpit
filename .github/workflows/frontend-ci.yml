name: Frontend

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-presentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit and API contract fixture tests
        run: npm run test

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Build static Astro routes
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E with marked contract fixture
        env:
          CI: true
        run: npm run test:e2e
