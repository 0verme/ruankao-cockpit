name: Docker Compose

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Docker Compose build, routing, and persistence smoke
        run: bash scripts/docker-compose-smoke.sh
