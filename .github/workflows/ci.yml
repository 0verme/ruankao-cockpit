name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate planner contract
        run: python scripts/validate_planner_contract.py

      - name: Validate review contract
        run: python scripts/validate_review_contract.py

      - name: Validate review replay
        run: python scripts/validate_review.py

      - name: Validate progress replay
        run: python scripts/validate_progress.py

      - name: Validate taxonomy
        run: python scripts/validate_taxonomy.py

      - name: Check diff whitespace
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
          else
            git diff --check
          fi
